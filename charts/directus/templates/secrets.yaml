{{- if .Values.mariadb.auth.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mariadb.auth.existingSecret }}
  labels:
    app.kubernetes.io/name: {{ include "directus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "directus.chart" . }}
  annotations:
    helm.sh/resource-policy: keep
    helm.sh/hook: "pre-install"
    helm.sh/hook-delete-policy: "before-hook-creation"
type: Opaque
data:
{{- $secret := lookup "v1" "Secret" .Release.Namespace "{{ .Values.mariadb.auth.existingSecret }}" -}}
{{- if $secret -}}
  ADMIN_PASSWORD: {{ $secret.data.ADMIN_PASSWORD }}
  SECRET: {{ $secret.data.SECRET }}
  KEY: {{ $secret.data.KEY }}
  mariadb-root-password: {{ $secret.data "mariadb-root-password" }}
  mariadb-password: {{ $secret.data "mariadb-password" }}
  mariadb-replication-password: {{ $secret.data "mariadb-replication-password" }}
{{- else }}
  ADMIN_PASSWORD: {{ randAlphaNum 10 | b64enc | quote }}
  SECRET: {{ randAlphaNum 10 | b64enc | quote }}
  KEY: {{ randAlphaNum 10 | b64enc | quote }}
  mariadb-root-password: {{ randAlphaNum 10 | b64enc | quote }}
  mariadb-password: {{ randAlphaNum 10 | b64enc | quote }}
  mariadb-replication-password: {{ randAlphaNum 10 | b64enc | quote }}
{{- end }}
{{- end }}
