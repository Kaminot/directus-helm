apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "directus.fullname" . }}-configmap
  labels:
    app.kubernetes.io/name: {{ include "directus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ include "directus.chart" . }}
data:
  DB_CLIENT: "{{ .Values.database.client }}"
  DB_HOST: {{- if .Values.mariadb.mariadbURL }} "{{ .Values.mariadb.mariadbURL }}" {{- else if .Values.database.host }} "{{ .Values.database.host }}" {{- else }} "{{ .Release.Name }}-mariadb.{{ .Release.Namespace }}.svc" {{- end }}
  DB_PORT: "{{ .Values.database.port }}"
  DB_DATABASE: {{- if .Values.database.database }} "{{ .Values.database.database }}" {{- else }} "{{ .Values.mariadb.auth.database }}" {{- end }}
  DB_USER: {{- if .Values.database.user }} "{{ .Values.database.user }}" {{- else }} "{{ .Values.mariadb.auth.username }}" {{- end }}
  HOST: '::'
  ADMIN_EMAIL: "{{ .Values.adminEmail }}"
  REDIS_ENABLED: {{- if .Values.redis.enabled }} "true" {{- else }} "false" {{- end }}
  {{- if .Values.redis.enabled}}
  REDIS_HOST: {{ .Release.Name }}-redis-master
  REDIS_PORT: "6379"
  REDIS_USERNAME: "default"
  {{- end}}
